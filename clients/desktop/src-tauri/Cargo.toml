[package]
name = "proteus-desktop"
version = "0.1.0"
edition = "2024"
publish = false
description = "Desktop client for the modular Proteus agent"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
proteus-client-common = { path = "../../common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = "debuginfo"
