[package]
name = "proteus-app-diagnostics"
version = "0.0.0-dev"
edition = "2024"
publish = false
description = "Embedded Proteus app diagnostics"

[dependencies]
proteus-contracts = { path = "../../../crates/proteus-contracts" }
console_error_panic_hook = "0.1"
leptos = { version = "0.8.19", features = ["csr"] }
proteus-app-common = { path = "../common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
send_wrapper = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "BeforeUnloadEvent",
    "AbortSignal",
    "Clipboard",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "Headers",
    "History",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Navigator",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Storage",
    "Url",
    "WheelEvent",
    "Window",
] }
