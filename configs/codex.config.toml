# Провайдер восстановлен из a18b3e1 (Track codex runtime config in repo):
# gpt-5.5 через личный прокси. Ключ И base_url живут per-PC в
# secrets/openai.json — в git только пути, ни ключа, ни хоста.
active_provider = "openai"

[providers.openai]
provider = "openai"
model = "gpt-5.6-luna"
stream = true

[providers.openai.provider_config]
api_key_file = "$HOME/.config/Proteus-agent/secrets/openai.json"
api_key_json_key = "openai_api_key"
base_url_file = "$HOME/.config/Proteus-agent/secrets/openai.json"
base_url_json_key = "base_url"
max_input_tokens = 400000
# Model-specific Responses controls. Неизвестные model ids получают в adapter-е
# conservative fallback; custom proxy slug поэтому декларирует capability явно.
support_verbosity = true
default_verbosity = "low"

[providers.openai.provider_config.capabilities]
supports_parallel_tool_calls = true
supports_freeform_tools = false
supports_json_schema = true
supports_reasoning_config = true

[providers.openai.reasoning]
effort = "high"
summary = true

# Base prompt: адаптированный upstream Codex base prompt из
# codex-rs/protocol/src/prompts/base_instructions/default.md на commit
# 2cf2a6a844f1fc2ddd489c8a67fa8bc2f59a6f3d. Harness-dependent divergence:
# identity/renderer говорят Proteus/client вместо Codex CLI; proxy-safe
# apply_patch остаётся function tool; permission-режимы названы auto/normal;
# добавлены фактическая per-command sandbox/netns семантика и предпочтение
# structured read/search tools.
[[instructions]]
kind = "System"
file = "prompts/codex-default.md"
priority = 100

[profile]
name = "codex-proxy"

[modules]
# Proxy-backed Codex-shaped profile. Keep this profile explicit so
# baseline coding profiles do not inherit Codex parity experiments by accident.
workflow = "coding.codex_loop"
search = "rg"
memory = "none"
context = "codex_context"
policy = "codex_policy"
patch = "direct"
compactor = "codex"
# Cache-stable hot set + deferred discovery: task text больше не пересобирает
# схемы на каждом turn-е, редкие tools доступны через proteus_tool_search/call.
tool_exposure = "codex_dynamic"
subagent = "sequential"
# Strict one-shot output stays model-authored text through the builtin renderer.
# The interactive client may render its own status UI without polluting stdout/transcripts.
renderer = "text"

[subagents]
# Experimental Codex-like async control surface. Переключите на `task`,
# чтобы оставить только прежний blocking facade; `none` скрывает оба режима.
surface = "collaboration"

[tools]
enabled = ["search", "read_file", "read_many_files", "list_dir", "find_files", "grep", "git_status", "git_diff", "request_user_input", "update_plan", "request_permissions", "apply_patch", "write_file", "shell", "exec_command", "write_stdin", "remember_fact"]

# playwright остаётся opt-in: dynamic exposure не отправит все его схемы в
# каждый запрос, но dogfood показал непрошеную браузерную верификацию. Включать
# только для реальной браузерной задачи.
# [[tools.mcp_servers]]
# name = "playwright"
# command = "npx"
# args = ["-y", "@playwright/mcp@latest", "--headless", "--isolated", "--browser", "firefox", "--output-dir", ".playwright-mcp", "--output-mode", "stdout"]
# safety = "Network"
# timeout_ms = 60000
# metadata = { scope = "browser-automation", category = "mcp", tags = ["mcp", "browser", "playwright", "desktop-app"] }

[permissions]
mode = "normal"

[module_config.policy.codex_policy]
allow = ["search", "read_file", "read_many_files", "list_dir", "find_files", "grep", "git_status", "git_diff", "request_user_input", "update_plan", "apply_patch", "write_file", "write_stdin"]
allow_sandboxed = ["shell", "exec_command"]
ask_before = [
  "shell",
  "exec_command",
  "request_permissions",
  "remember_fact",
  "playwright__browser_close",
  "playwright__browser_resize",
  "playwright__browser_console_messages",
  "playwright__browser_handle_dialog",
  "playwright__browser_evaluate",
  "playwright__browser_file_upload",
  "playwright__browser_drop",
  "playwright__browser_fill_form",
  "playwright__browser_press_key",
  "playwright__browser_type",
  "playwright__browser_navigate",
  "playwright__browser_navigate_back",
  "playwright__browser_network_requests",
  "playwright__browser_network_request",
  "playwright__browser_take_screenshot",
  "playwright__browser_snapshot",
  "playwright__browser_click",
  "playwright__browser_drag",
  "playwright__browser_hover",
  "playwright__browser_select_option",
  "playwright__browser_tabs",
  "playwright__browser_wait_for",
]
deny = ["playwright__browser_run_code_unsafe"]

[module_config.compactor.codex]
trigger_fraction = 0.8

[module_config.subagent.sequential]
max_resumable = 8

[[module_config.subagent.sequential.roles]]
name = "explore"
description = "Read-only codebase explorer for focused research questions (find definitions, trace call paths, map structure). Returns concise findings with file paths and line numbers."
prompt = """You are a read-only codebase researcher inside the Proteus harness. Answer the specific question you were given — nothing more.

Rules:
- Inspect, never modify: you have only read/search tools.
- Be fast and authoritative: prefer targeted search over broad reading.
- Map before reading: start with list_dir/find_files to locate relevant paths instead of guessing file locations.
- Batch your work: emit several independent tool calls in one response and read related files together via read_many_files instead of one read_file at a time.
- Read whole files: for files under ~2000 lines skip the limit parameter entirely; chunked reading is only for very large files.
- Final answer must be a concise report: findings with file paths and line numbers, short quotes only where they carry the answer.
- If you cannot find something, say so explicitly and list where you looked."""
tools = ["search", "read_file", "read_many_files", "list_dir", "find_files", "grep", "git_status", "git_diff"]
# Строго read-only allowlist выше делает роль безопасной для конкурентного
# запуска: несколько task-вызовов explore в одном ответе модели идут параллельно.
parallel_safe = true
max_iterations = 15
max_summary_bytes = 8192
# Потолок суммарного spend запуска (input+output всех model-запросов ребёнка).
# Первая прикидка; превышение = статус token_budget_exceeded + resume по task_id.
max_total_tokens = 300000

[[module_config.subagent.sequential.roles]]
name = "coder"
description = "Isolated coder for a self-contained code change. Works in its own git worktree and commits to its own branch; the parent reviews and merges the branch afterwards."
prompt = """You are a focused coding subagent inside the Proteus harness, working in your own git worktree on a dedicated branch. Implement exactly the change you were asked for — nothing more.

Rules:
- Your cwd is an isolated worktree: edit freely, the parent checkout is untouched.
- Stay on task: no refactors, cleanups, or extras beyond the request.
- Verify what you can (build/tests via shell) before finishing.
- Commit your work to the current branch with a clear message; uncommitted changes also survive, but a commit is preferred.
- Final answer must be a concise report: what changed (files), how it was verified, and anything the parent must know before merging."""
tools = ["search", "read_file", "read_many_files", "list_dir", "find_files", "grep", "git_status", "git_diff", "write_file", "shell"]
# Изоляция структурная: каждый fresh запуск получает собственный worktree,
# поэтому несколько coder-вызовов в одном ответе модели идут параллельно.
isolation = "worktree"
max_iterations = 25
max_summary_bytes = 8192
# Пишущая роль дороже: больше итераций, растущая история. Тоже первая прикидка.
max_total_tokens = 1500000

[module_config.tool_exposure.codex_dynamic]
max_hot_tools = 10
always_include = ["request_user_input", "update_plan", "request_permissions", "exec_command", "write_stdin", "apply_patch"]

[module_config.context.codex_context]
# Strict Codex-shaped context: upstream expects the model to inspect the repo
# through tools instead of preloading git/tree/manifest/search results.
providers = ["project_instructions", "environment"]
max_context_bytes = 60000
max_bytes_per_file = 12000
project_instruction_files = ["AGENTS.override.md", "AGENTS.md"]

[app_server]
approval_timeout_ms = 0

[runtime]
model_timeout_ms = 10800000
context_timeout_ms = 30000
workflow_timeout_ms = 14400000

[event_log]
path = ".proteus/events.jsonl"
