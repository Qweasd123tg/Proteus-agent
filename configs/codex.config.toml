include = [
  "fragments/openai-proxy.toml",
  "fragments/codex-runtime.toml",
  "fragments/codex-profile.toml",
]

# Личный proxy overlay. Ключ и base_url живут per-PC в
# secrets/openai.json; общий launch/runtime shape находится во fragments/.
[providers.openai]
model = "gpt-5.6-luna"

[providers.openai.provider_config]
# Неизвестные model ids получают conservative capability fallback, поэтому
# custom proxy slug декларирует model-specific controls явно.
support_verbosity = true
default_verbosity = "low"
# xcody возвращает `get_channel_failed` для полного Responses request через
# согласованный HTTP/2, хотя тот же wire body проходит через HTTP/1.1.
http1_only = true
