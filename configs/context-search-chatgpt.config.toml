# Экспериментальная сборка: тот же subscription coding workflow,
# context/v2 заменён на repo_aware с предварительным поиском по задаче.
include = "codex-chatgpt.config.toml"

[profile]
name = "context-search-chatgpt"

[modules]
context = "repo_aware"

# Дополнительный export того же component; активный slot выбирается выше.
[components.reference-context.exports.context.repo_aware]

[module_config.context.repo_aware]
providers = ["project_instructions", "skills", "environment", "search"]
max_context_bytes = 60000
max_bytes_per_file = 12000
max_search_results = 8
project_instruction_files = ["AGENTS.override.md", "AGENTS.md"]
