active_provider = "anthropic"

[providers.anthropic]
provider = "anthropic"
model = "claude-sonnet-4-20250514"
stream = true

[module_config.model.anthropic]
implementation = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
base_url = "https://api.anthropic.com"
auth = "x-api-key"
api_version = "2023-06-01"
prompt_cache = true
# По умолчанию Anthropic prompt cache живёт 5m. Включайте 1h явно только
# если повышенная цена cache-write подходит под workload.
# prompt_cache_ttl = "1h"

[providers.anthropic.reasoning]
effort = "high"
summary = true
budget_tokens = 8192

[components.reference-model]
command = "proteus-reference-worker"
env_allowlist = ["HOME", "OPENAI_API_KEY", "ANTHROPIC_API_KEY", "HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "NO_PROXY", "http_proxy", "https_proxy", "all_proxy", "no_proxy"]

[components.reference-model.exports.model.anthropic]
