include = [
  "fragments/openai-chatgpt.toml",
  "fragments/codex-runtime.toml",
  "fragments/codex-profile.toml",
]
active_provider = "chatgpt"

[profile]
name = "codex-chatgpt"

[agent_control]
surface = "collaboration"
[providers.chatgpt]
provider = "openai_codex"
model = "gpt-5.6-luna"
stream = true
reasoning_efforts = []
[module_config.compactor.codex]

# Массив полностью заменяет роли codex-runtime: peers также используют подписку.
[[agent_control.roles]]
name = "explore"
description = "Read-only codebase explorer. Uses the ChatGPT subscription profile."
config = "codex-chatgpt-explore"
parallel_safe = true
max_processes = 4
timeout_ms = 14400000
max_summary_bytes = 8192

[providers.chatgpt.reasoning]
effort = "high"
summary = true

[permissions]
mode = "normal"

[modules]
workflow = "coding.codex_loop"
context = "codex_context"
compactor = "codex"
policy = "codex_policy"
search = "rg"
patch = "codex"
hooks = ["hook.dcp"]

[module_config.context.codex_context]
max_bytes_per_file = 12000
max_context_bytes = 60000
project_doc_max_bytes = 32768
project_instruction_files = [
    "AGENTS.override.md",
    "AGENTS.md",
]
providers = [
    "project_instructions",
    "environment",
    "repo_tree",
]

[[agent_control.roles]]
name = "coder"
description = "Isolated coder in its own worktree. Uses the ChatGPT subscription profile."
config = "codex-chatgpt-coder"
isolation = "worktree"
max_processes = 4
timeout_ms = 14400000
max_summary_bytes = 8192

[module_config.model.openai_codex]
auth_file = "$HOME/.config/Proteus-agent/secrets/chatgpt.json"
default_verbosity = "low"
implementation = "openai_codex"
max_input_tokens = 200000
prompt_cache = true
support_verbosity = true

[module_config.model.openai_codex.capabilities]
supports_freeform_tools = false
supports_image_input = true
supports_json_schema = true
supports_parallel_tool_calls = true
supports_reasoning_config = true

[module_config.patch.codex]
reject_self_move = true

[module_config.policy.codex_policy]
allow = [
    "skill",
    "search",
    "read_file",
    "read_many_files",
    "list_dir",
    "find_files",
    "grep",
    "git_status",
    "git_diff",
    "request_user_input",
    "update_plan",
    "apply_patch",
    "write_file",
    "write_stdin",
]
allow_sandboxed = [
    "shell",
    "exec_command",
]
ask_before = [
    "lsp_diagnostics",
    "shell",
    "exec_command",
    "request_permissions",
    "remember_fact",
]

[module_config.workflow."coding.codex_loop"]
stream_max_retries = 5

[tools]
enabled = ["apply_patch", "exec_command", "find_files", "git_diff", "git_status", "grep", "list_dir", "lsp_diagnostics", "read_file", "read_many_files", "remember_fact", "request_permissions", "request_user_input", "search", "shell", "skill", "update_plan", "write_file", "write_stdin", "compress", "dcp"]

# Самостоятельный Node component; proteus-dcp должен быть доступен в PATH.
[components.dcp]
command = "proteus-dcp"
env_allowlist = ["HOME", "XDG_DATA_HOME"]

[components.dcp.exports.hook."hook.dcp"]
[components.dcp.exports.tool."dcp.tools"]

# Оба exports делят prune state и требуют одинаковых настроек.
[module_config.hook."hook.dcp"]
compress = { mode = "range", protectTags = true }

[module_config.tool."dcp.tools"]
compress = { mode = "range", protectTags = true }
