# Общий Codex-shaped runtime для tracked codex/glm профилей и `proteus init
# codex`. Это config fragment, а не самостоятельный профиль или standard pack:
# provider и profile-specific policy/context задаёт overlay.

# Настраиваемый Proteus prompt. Исходная адаптация опиралась на
# codex-rs/protocol/src/prompts/base_instructions/default.md на commit
# 2cf2a6a844f1fc2ddd489c8a67fa8bc2f59a6f3d; текущий текст сокращён и не является
# pinned копией upstream. Он сохраняет Proteus tool/patch/permission contracts.
# Runtime parity проверяется отдельно; в сравнении фиксируется и этот prompt.
[[instructions]]
kind = "System"
file = "prompts/codex-default.md"
priority = 100

[modules]
workflow = "coding.codex_loop"
search = "rg"
context = "codex_context"
policy = "codex_policy"
patch = "codex"
compactor = "codex"

[components.reference-workflow]
command = "proteus-reference-module"

[components.reference-workflow.exports.workflow."coding.codex_loop"]

[module_config.workflow."coding.codex_loop"]
# Повторы оборванного model stream с сохранённой историей; HTTP retry настраивается отдельно.
stream_max_retries = 5

[components.reference-context]
command = "proteus-reference-module"

[components.reference-context.exports.context.codex_context]

[components.reference-capabilities]
command = "proteus-reference-module"
env_allowlist = ["HOME", "PROTEUS_HOME"]

[components.reference-capabilities.exports.search.rg]

[components.reference-capabilities.exports.context_provider.skills]

[components.reference-capabilities.exports.policy.codex_policy]

[components.reference-capabilities.exports.patch.codex]

[components.reference-capabilities.exports.compactor.codex]

# Отдельные паки tools делят тот же процесс и сохраняют прежнюю tool surface.
[components.reference-capabilities.exports.tool.file_tools]

[components.reference-capabilities.exports.tool.git_tools]

[components.reference-capabilities.exports.tool.shell_tools]

[components.reference-capabilities.exports.tool.plan_tool]

[components.reference-capabilities.exports.tool.rust_lsp]

[components.reference-capabilities.exports.tool.skill_tool]

[components.reference-capabilities.exports.tool.policy_tools]

[tools]
enabled = ["skill", "search", "read_file", "read_many_files", "list_dir", "find_files", "grep", "lsp_diagnostics", "git_status", "git_diff", "request_user_input", "update_plan", "request_permissions", "apply_patch", "write_file", "shell", "exec_command", "write_stdin", "remember_fact"]

[permissions]
mode = "normal"

[module_config.compactor.codex]
# Порог по умолчанию: 90% окна модели; trigger_tokens может задать меньший.

[module_config.patch.codex]
reject_self_move = true

[agent_control]
max_depth = 1
cancel_grace_ms = 5000
max_parallel = 8
max_idle_processes = 8

[[agent_control.roles]]
name = "explore"
description = "Read-only codebase explorer for focused research questions (find definitions, trace call paths, map structure). Returns concise findings with file paths and line numbers."
config = "codex-explore"
# Read-only child config делает роль безопасной для конкурентного запуска.
parallel_safe = true
max_processes = 4
timeout_ms = 14400000
max_summary_bytes = 8192

[[agent_control.roles]]
name = "coder"
description = "Isolated coder for a self-contained code change. Works in its own git worktree and commits to its own branch; the parent reviews and merges the branch afterwards."
config = "codex-coder"
# Каждый fresh запуск получает собственный worktree; child config владеет
# prompt, model, workflow, tools и policy.
isolation = "worktree"
max_processes = 4
timeout_ms = 14400000
max_summary_bytes = 8192

[module_config.context.codex_context]
max_context_bytes = 60000
max_bytes_per_file = 12000
project_doc_max_bytes = 32768
project_instruction_files = ["AGENTS.override.md", "AGENTS.md"]

[app_server]
approval_timeout_ms = 0

[runtime]
model_timeout_ms = 10800000
context_timeout_ms = 30000
workflow_timeout_ms = 14400000

[event_log]
path = ".proteus/events.jsonl"
