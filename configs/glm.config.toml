include = [
  "fragments/openai-proxy.toml",
  "fragments/codex-runtime.toml",
]

[providers.openai]
model = "glm-5.2"

[providers.openai.provider_config]
# Diagnostic proxy profile: разрешаем прежний one-shot non-stream retry при
# повреждённом SSE. Strict codex profile этот fallback намеренно не включает.
stream_error_fallback = true

[profile]
name = "glm-proxy"

[modules]
# GLM сохраняет общий Codex-shaped runtime, но добавляет status renderer.
renderer = "statusline"

# Component maps merge recursively across includes, so GLM adds one export
# without repeating the common launch topology.
[components.reference-capabilities.exports.renderer.statusline]

[subagents]
# GLM-профиль сохраняет foreground task surface.
surface = "task"

[module_config.policy.codex_policy]
allow = ["skill", "search", "read_file", "read_many_files", "list_dir", "find_files", "grep", "git_status", "git_diff", "request_user_input", "update_plan", "write_stdin"]
allow_sandboxed = ["shell", "exec_command"]
ask_before = ["lsp_diagnostics", "apply_patch", "write_file", "shell", "exec_command", "request_permissions", "remember_fact"]

[module_config.context.codex_context]
providers = ["project_instructions", "skills", "environment", "git_status", "git_diff", "repo_tree", "manifest", "search"]
max_search_results = 40
repo_tree_max_entries = 300
repo_tree_max_depth = 4
git_diff_max_bytes = 16000
repo_tree_skip_entries = [
  ".git",
  "target",
  "node_modules",
  ".proteus",
  "sessions",
  "dist",
  "build",
  "examples/source",
  "examples/research",
  ".env",
  "secrets.json",
  "config.local.json",
]
project_instruction_files = ["AGENTS.override.md", "AGENTS.md", "CLAUDE.md", ".cursorrules"]
manifest_files = ["Cargo.toml", "package.json", "pyproject.toml", "go.mod", "pom.xml", "build.gradle", "composer.json", "README.md"]
