active_provider = "anthropic"

[providers.anthropic]
provider = "anthropic"
model = "deepseek-v4-pro"
stream = true

[providers.anthropic.provider_config]
api_key_file = "$HOME/.config/Proteus-agent/secrets/anthropic.json"
api_key_json_key = "anthropic_api_key"
base_url_file = "$HOME/.config/Proteus-agent/secrets/anthropic.json"
base_url_json_key = "base_url"
auth = "bearer"
api_version = "2023-06-01"

[providers.anthropic.reasoning]
effort = "high"
summary = true
budget_tokens = 8192

[profile]
name = "coding-local"

[modules]
# Provided by the explicit reference process worker installed by ./install.sh.
workflow = "coding.single_loop"
search = "rg"
context = "repo_aware"
policy = "ask_write"
patch = "direct"
compactor = "codex"
renderer = "statusline"

[[process_modules]]
slot = "workflow"
module_id = "coding.single_loop"
command = "proteus-reference-worker"

[[process_modules]]
slot = "search"
module_id = "rg"
command = "proteus-reference-worker"

[[process_modules]]
slot = "context"
module_id = "repo_aware"
command = "proteus-reference-worker"

[[process_modules]]
slot = "context_provider"
module_id = "skills"
command = "proteus-reference-worker"

[[process_modules]]
slot = "policy"
module_id = "ask_write"
command = "proteus-reference-worker"

[[process_modules]]
slot = "patch"
module_id = "direct"
command = "proteus-reference-worker"

[[process_modules]]
slot = "compactor"
module_id = "codex"
command = "proteus-reference-worker"

[[process_modules]]
slot = "renderer"
module_id = "statusline"
command = "proteus-reference-worker"

[[process_modules]]
slot = "tool"
module_id = "reference.tools"
command = "proteus-reference-worker"

[tools]
# Full local coding toolset. File I/O and repo navigation come from
# file-tools, git helpers come from git-tools, shell comes from shell-tool,
# and search/apply_patch/remember_fact are core slot facade tools.
# Run ./install.sh before using this profile so the reference worker is on PATH.
enabled = ["skill", "search", "read_file", "read_many_files", "list_dir", "find_files", "grep", "lsp_diagnostics", "git_status", "git_diff", "request_user_input", "apply_patch", "write_file", "shell", "remember_fact"]

[permissions]
mode = "normal"

[module_config.policy.ask_write]
allow = ["skill", "search", "read_file", "read_many_files", "list_dir", "find_files", "grep", "git_status", "git_diff", "request_user_input"]
ask_before = ["lsp_diagnostics", "apply_patch", "write_file", "shell", "remember_fact"]

[module_config.context.repo_aware]
providers = ["project_instructions", "skills", "manifest", "git_status", "repo_tree", "memory", "search"]
max_context_bytes = 60000
max_bytes_per_file = 8000
max_search_results = 50
memory_limit = 5
repo_tree_max_entries = 300
repo_tree_max_depth = 3
repo_tree_skip_entries = [".git", "target", "node_modules", ".proteus", "sessions", "dist", "build", ".env", "secrets.json", "config.local.json"]
project_instruction_files = ["AGENTS.md", "CLAUDE.md", ".cursorrules"]
manifest_files = ["Cargo.toml", "package.json", "pyproject.toml", "go.mod", "pom.xml", "build.gradle", "composer.json"]

[app_server]
approval_timeout_ms = 0

[runtime]
model_timeout_ms = 10800000
context_timeout_ms = 30000
workflow_timeout_ms = 14400000

[event_log]
path = ".proteus/events.jsonl"
