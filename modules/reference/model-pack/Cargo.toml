[package]
name = "model-pack"
version = "0.0.0-dev"
edition = "2024"
publish = false

[dependencies]
proteus-contracts = { path = "../../../crates/proteus-contracts" }
anyhow = "1"
async-trait = "0.1"
async-stream = "0.3"
eventsource-stream = "0.2"
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "net", "io-util"] }

[dev-dependencies]
proteus-core = { path = "../../../crates/proteus-core" }
tempfile = "3"
