[package]
name = "sqlite-memory"
version = "0.1.0-alpha.1"
edition = "2024"
publish = false

[dependencies]
proteus-contracts = { path = "../../../crates/proteus-contracts" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rusqlite = { version = "0.33", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
