[package]
name = "proteus-module-protocol"
version = "0.0.0-dev"
edition = "2024"

[dependencies]
proteus-contracts = { path = "../proteus-contracts" }
proteus-process-host = { path = "../proteus-process-host" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[[test]]
name = "multiplex_spike"
path = "tests/multiplex_spike.rs"
harness = false

[[test]]
name = "broker_v3"
path = "tests/broker_v3.rs"
harness = false
