[package]
name = "proteus-module-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
proteus-contracts = { path = "../proteus-contracts" }
proteus-process-host = { path = "../proteus-process-host" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "session"
path = "tests/session.rs"
harness = false

[[test]]
name = "multiplex_spike"
path = "tests/multiplex_spike.rs"
harness = false
