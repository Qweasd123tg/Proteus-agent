[package]
name = "proteus-core"
version = "0.0.0-dev"
edition = "2024"

[[bin]]
name = "proteus"
path = "src/main.rs"

[dependencies]
a2a = { package = "a2a-lf", git = "https://github.com/a2aproject/a2a-rs.git", rev = "c7cefa0b4276805efbcfd2ddd3238c22e5f36b8f" }
a2a-server = { package = "a2a-server-lf", git = "https://github.com/a2aproject/a2a-rs.git", rev = "c7cefa0b4276805efbcfd2ddd3238c22e5f36b8f", default-features = false }
axum = "0.8"
proteus-contracts = { path = "../proteus-contracts" }
proteus-module-protocol = { path = "../proteus-module-protocol" }
proteus-process-host = { path = "../proteus-process-host" }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
async-stream = "0.3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
toml_edit = "0.22"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
a2a-client = { package = "a2a-client-lf", git = "https://github.com/a2aproject/a2a-rs.git", rev = "c7cefa0b4276805efbcfd2ddd3238c22e5f36b8f", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile = "3"
