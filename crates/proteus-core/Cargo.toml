[package]
name = "proteus-core"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "proteus"
path = "src/main.rs"

[dependencies]
proteus-contracts = { path = "../proteus-contracts" }
proteus-module-protocol = { path = "../proteus-module-protocol" }
proteus-process-host = { path = "../proteus-process-host" }
libloading = "0.8"
anyhow = "1"
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
eventsource-stream = "0.2"
async-stream = "0.3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
toml_edit = "0.22"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
coding-workflow = { path = "../../modules/reference/coding-workflow" }
codex-compactor = { path = "../../modules/reference/codex-compactor" }
codex-tool-exposure = { path = "../../modules/reference/codex-tool-exposure", default-features = false }
context-pack = { path = "../../modules/reference/context-pack", default-features = false }
memory-pack = { path = "../../modules/reference/memory-pack", default-features = false }
policy-pack = { path = "../../modules/reference/policy-pack", default-features = false }
renderer-pack = { path = "../../modules/reference/renderer-pack", default-features = false }
skill-pack = { path = "../../modules/reference/skill-pack" }
tempfile = "3"
