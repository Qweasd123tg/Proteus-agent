active_provider = "fake"

[profile]
name = "process-agent-example"

[providers.fake]
provider = "fake"
model = "fake-tool-model"
stream = true

[modules]
workflow = "process"
search = "null"
memory = "none"
context = "none"
policy = "deny_all"
patch = "null"
compactor = "none"
tool_exposure = "all_visible"
subagent = "none"
renderer = "text"

[module_config.workflow.process]
module_id = "python_agent_loop"
command = "python3"
args = ["examples/modules/agent-worker/agent.py"]
handshake_timeout_ms = 30000

[module_config.workflow.process.config]
max_tool_rounds = 8
system_instructions = "You are a small process-hosted modular agent. Use only tools exposed by the host."

[tools]
enabled = []

[permissions]
mode = "normal"

[runtime]
model_timeout_ms = 10800000
context_timeout_ms = 30000
workflow_timeout_ms = 14400000
