active_provider = "fake"

[profile]
name = "process-agent-example"

[providers.fake]
provider = "fake"
model = "fake-tool-model"
stream = true

[modules]
workflow = "python_agent_loop"

[components.python-agent]
command = "python3"
args = ["-B", "examples/modules/agent-worker/agent.py"]
handshake_timeout_ms = 30000

[components.python-agent.exports.workflow.python_agent_loop]

[module_config.workflow.python_agent_loop]
max_tool_rounds = 8
system_instructions = "You are a small process-hosted modular agent. Use only tools exposed by the host."

[tools]
enabled = []

[permissions]
mode = "normal"

[runtime]
model_timeout_ms = 10800000
context_timeout_ms = 30000
workflow_timeout_ms = 14400000

[components.reference-model]
command = "proteus-reference-worker"
env_allowlist = ["HOME", "OPENAI_API_KEY", "ANTHROPIC_API_KEY", "HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "NO_PROXY", "http_proxy", "https_proxy", "all_proxy", "no_proxy"]

[components.reference-model.exports.model.fake]

[module_config.model.fake]
implementation = "fake"
