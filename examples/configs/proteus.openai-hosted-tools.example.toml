include = "proteus.coding.example.toml"

# Opt-in example for OpenAI Responses built-in tools. Replace the vector store
# placeholder before allowing file_search in a real profile.
active_provider = "openai"

[profile]
name = "openai-hosted-tools"

[providers.openai]
provider = "openai"
model = "gpt-5.6"
stream = true

[providers.openai.provider_config]
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"

[providers.openai.provider_config.capabilities]
supports_parallel_tool_calls = true
supports_freeform_tools = false
supports_json_schema = true
supports_reasoning_config = true
hosted_tools = ["web_search", "file_search"]

[providers.openai.provider_config.hosted_tools]
max_tool_calls = 2

[providers.openai.provider_config.hosted_tools.web_search]
search_context_size = "low"
include_sources = true
allowed_domains = []
blocked_domains = []
external_web_access = true

[providers.openai.provider_config.hosted_tools.file_search]
vector_store_ids = ["vs_replace_me"]
max_num_results = 5
include_results = false

[providers.openai.reasoning]
effort = "high"
summary = true

# Hosted tools are registered by the model adapter, not tools.enabled. Because
# provider execution happens inside the model request, Ask cannot pause it:
# explicitly Allow the canonical names or they remain hidden.
[module_config.policy.ask_write]
allow = ["search", "read_file", "read_many_files", "list_dir", "find_files", "grep", "git_status", "git_diff", "request_user_input", "web_search", "file_search"]
ask_before = ["apply_patch", "write_file", "shell", "remember_fact"]
