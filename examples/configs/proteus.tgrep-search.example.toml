# Самостоятельный пример tool search на tgrep; без context provider.
active_provider = "fake"

[profile]
name = "tgrep-search-example"

[providers.fake]
provider = "fake"
model = "fake-tool-model"
stream = true

[modules]
workflow = "coding.single_loop"
context = "simple"
policy = "ask_write"

[components.reference-workflow]
command = "proteus-reference-module"
[components.reference-workflow.exports.workflow."coding.single_loop"]

[components.reference-context]
command = "proteus-reference-module"
[components.reference-context.exports.context.simple]

[components.reference-policy]
command = "proteus-reference-module"
[components.reference-policy.exports.policy.ask_write]

[components.reference-model]
command = "proteus-reference-module"
[components.reference-model.exports.model.fake]

[components.tgrep-search]
command = "python3"
args = ["-B", "examples/modules/tgrep-search/tool.py"]
[components.tgrep-search.exports.tool.tgrep_search]
timeout_ms = 65000

[module_config.tool.tgrep_search]
# Для binary вне PATH задайте его абсолютный путь:
# binary = "/path/to/tgrep"
# По умолчанию tgrep использует .tgrep в cwd. Для внешнего индекса задайте
# index_path = "/path/to/index" и тот же --index-path у tgrep serve/index.

[module_config.model.fake]
implementation = "fake"

[module_config.policy.ask_write]
allow = ["search"]

[tools]
enabled = ["search"]

[permissions]
mode = "normal"
