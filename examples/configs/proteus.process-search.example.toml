active_provider = "fake"

[profile]
name = "process-search-example"

[providers.fake]
provider = "fake"
model = "fake-tool-model"
stream = true

[modules]
workflow = "coding.single_loop"
search = "process"
memory = "none"
context = "simple"
patch = "null"
compactor = "none"
tool_exposure = "all_visible"
subagent = "none"
renderer = "statusline"

[module_config.search.process]
module_id = "python_rg"
command = "python3"
args = ["examples/modules/search-process/search.py"]
timeout_ms = 60000

[module_config.context.simple]
max_search_results = 20

[tools]
enabled = ["search"]
