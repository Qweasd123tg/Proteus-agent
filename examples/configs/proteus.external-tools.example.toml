active_provider = "fake"

[profile]
name = "external-tools"

[providers.fake]
provider = "fake"
model = "fake-tool-model"
stream = true

[modules]
workflow = "coding.plan_execute_review"
context = "simple"
policy = "ask_write"
renderer = "statusline"

[[process_modules]]
slot = "workflow"
module_id = "coding.plan_execute_review"
command = "proteus-reference-worker"

[[process_modules]]
slot = "context"
module_id = "simple"
command = "proteus-reference-worker"

[[process_modules]]
slot = "policy"
module_id = "ask_write"
command = "proteus-reference-worker"

[[process_modules]]
slot = "renderer"
module_id = "statusline"
command = "proteus-reference-worker"

[tools]
enabled = []
# path omitted: defaults to the tools directory next to the config root.
# With the standard layout this is ~/.config/Proteus-agent/tools.
# Keep module_config.policy.ask_write in sync with the names registered by those manifests.

[permissions]
mode = "normal"

[module_config.policy.ask_write]
# Core slot facade tools ship only apply_patch, remember_fact, and search.
# File I/O, git helpers, and shell are process-module tools when enabled.
ask_before = ["apply_patch", "remember_fact"]
allow = ["search"]

[module_config.context.simple]
max_search_results = 50

[app_server]
approval_timeout_ms = 0

[event_log]
path = ".proteus/events.jsonl"
