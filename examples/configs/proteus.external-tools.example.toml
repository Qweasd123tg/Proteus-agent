active_provider = "fake"

[profile]
name = "external-tools"

[providers.fake]
provider = "fake"
model = "fake-tool-model"
stream = true

[modules]
# Provided by the coding-workflow plugin installed by ./install.sh.
workflow = "coding.plan_execute_review"
search = "null"
memory = "none"
context = "simple"
patch = "null"
compactor = "none"
tool_exposure = "all_visible"
renderer = "statusline"

[tools]
enabled = []
# path omitted: defaults to the tools directory next to the config root.
# With the standard layout this is ~/.config/Proteus-agent/tools.
# All enabled tools are callable directly; configured processes are trusted code.

[module_config.search.rg]
max_results = 50

[module_config.context.simple]
max_search_results = 50

[module_config.context.repo_aware]
providers = ["project_instructions", "manifest", "git_status", "repo_tree", "memory", "search"]
max_context_bytes = 60000
max_bytes_per_file = 8000
max_search_results = 50
memory_limit = 5
repo_tree_max_entries = 300
repo_tree_max_depth = 3
repo_tree_skip_entries = [".git", "target", "node_modules", ".proteus", "sessions", "dist", "build", ".env", "secrets.json", "config.local.json"]
project_instruction_files = ["AGENTS.override.md", "AGENTS.md", "CLAUDE.md", ".cursorrules"]
manifest_files = ["Cargo.toml", "package.json", "pyproject.toml", "go.mod", "pom.xml", "build.gradle", "composer.json"]

[event_log]
path = ".proteus/events.jsonl"
