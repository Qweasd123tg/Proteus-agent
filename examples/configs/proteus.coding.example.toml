include = "../../configs/proteus.provider.example.toml"

[profile]
name = "coding-local"

[modules]
# Provided by the coding-workflow plugin installed by ./install.sh.
workflow = "coding.single_loop"
# Provided by the rg-search plugin installed by ./install.sh.
search = "rg"
memory = "none"
context = "repo_aware"
# Provided by the direct-patch plugin installed by ./install.sh.
patch = "direct"
compactor = "codex"
tool_exposure = "all_visible"
subagent = "sequential"
renderer = "statusline"

[subagents]
surface = "task"

[tools]
# Full local coding toolset. File I/O and repo navigation come from
# file-tools, git helpers come from git-tools, shell comes from shell-tool,
# and search/apply_patch/remember_fact are core slot facade tools.
# Run ./install.sh before using this profile so plugin tools are registered.
enabled = ["skill", "search", "read_file", "read_many_files", "list_dir", "find_files", "grep", "lsp_diagnostics", "git_status", "git_diff", "request_user_input", "apply_patch", "write_file", "shell", "remember_fact"]

[module_config.compactor.codex]
trigger_fraction = 0.8

