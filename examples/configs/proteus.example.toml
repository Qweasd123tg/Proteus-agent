active_provider = "fake"

[profile]
name = "dev-basic"

[providers.fake]
provider = "fake"
model = "fake-tool-model"
stream = true

[modules]
workflow = "coding.single_loop"
context = "simple"
policy = "ask_write"

[components.reference-workflow]
command = "proteus-reference-worker"

[components.reference-workflow.exports.workflow."coding.single_loop"]

[components.reference-context]
command = "proteus-reference-worker"

[components.reference-context.exports.context.simple]

[components.reference-capabilities]
command = "proteus-reference-worker"

[components.reference-capabilities.exports.policy.ask_write]

[agent_control]
surface = "none"

[tools]
# Core-resident slot facade tools. Add a `tool/reference.tools` process
# export before enabling file, git, shell, plan, skill, or LSP tools.
enabled = ["apply_patch", "remember_fact", "request_user_input", "search"]

[permissions]
mode = "normal"

[module_config.policy.ask_write]
ask_before = ["apply_patch", "remember_fact"]
allow = ["search", "request_user_input"]

[module_config.context.simple]
max_search_results = 50

[app_server]
approval_timeout_ms = 0

[runtime]
model_timeout_ms = 10800000
context_timeout_ms = 30000
workflow_timeout_ms = 14400000

[event_log]
path = ".proteus/events.jsonl"

# Настройки веб-клиента (clients/web). Доставляются фронту через /config.
[web]
# Сворачивать карточки тулов по умолчанию (false — раскрыты, как сейчас).
tool_cards_collapsed = false
